<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x1F380; Happy Birthday &#x5C0F;&#x5357;&#x74DC;&#xFF01;&#x1F380;</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --light-pink: #ffb6d3;
            --lighter-pink: #ffe0ec;
            --white: #ffffff;
            --yellow: #ffe066;
            --red: #ff4444;
            --bg: #fff5f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffe0ec 0%, #fff0f5 30%, #ffe0ec 60%, #ffd1e0 100%);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
            position: relative;
        }

        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-icon {
            position: absolute;
            opacity: 0.3;
            animation: floatAround 15s infinite ease-in-out;
            font-size: 3rem;
            user-select: none;
        }

        .floating-icon:nth-child(1)  { top: 5%;  left: 5%;  animation-delay: 0s; animation-duration: 14s; }
        .floating-icon:nth-child(2)  { top: 8%;  left: 85%; animation-delay: -3s; animation-duration: 18s; }
        .floating-icon:nth-child(3)  { top: 70%; left: 90%; animation-delay: -7s; animation-duration: 16s; }
        .floating-icon:nth-child(4)  { top: 80%; left: 10%; animation-delay: -5s; animation-duration: 20s; }
        .floating-icon:nth-child(5)  { top: 50%; left: 50%; animation-delay: -2s; animation-duration: 13s; font-size: 2rem; }
        .floating-icon:nth-child(6)  { top: 15%; left: 45%; animation-delay: -9s; animation-duration: 17s; font-size: 2.5rem; }
        .floating-icon:nth-child(7)  { top: 85%; left: 75%; animation-delay: -4s; animation-duration: 19s; }
        .floating-icon:nth-child(8)  { top: 40%; left: 20%; animation-delay: -6s; animation-duration: 15s; font-size: 2rem; }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25%      { transform: translate(30px, -40px) rotate(8deg) scale(1.1); }
            50%      { transform: translate(-20px, -15px) rotate(-5deg) scale(0.9); }
            75%      { transform: translate(-35px, 30px) rotate(6deg) scale(1.05); }
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            animation: confettiFall linear infinite;
            opacity: 0.8;
        }

        @keyframes confettiFall {
            0%   { transform: translateY(-120px) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(255, 107, 157, 0.2),
                0 0 0 3px rgba(255, 182, 211, 0.4),
                inset 0 0 40px rgba(255, 182, 211, 0.1);
            animation: cardAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: visible;
        }

        @keyframes cardAppear {
            0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .bow-wrapper {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .bow {
            position: relative;
            width: 80px;
            height: 60px;
        }

        .bow-center {
            position: absolute;
            width: 28px;
            height: 28px;
            background: var(--red);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 2px 8px rgba(255, 68, 68, 0.4);
        }

        .bow-left, .bow-right {
            position: absolute;
            width: 40px;
            height: 45px;
            background: var(--pink);
            border-radius: 50% 50% 50% 10%;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 3px 10px rgba(255, 107, 157, 0.4);
        }

        .bow-left {
            left: 0;
            transform: translateY(-50%) rotate(25deg);
            border-radius: 50% 10% 50% 50%;
        }

        .bow-right {
            right: 0;
            transform: translateY(-50%) rotate(-25deg);
            border-radius: 10% 50% 50% 50%;
        }

        .bow-ribbon-left, .bow-ribbon-right {
            position: absolute;
            width: 14px;
            height: 45px;
            background: var(--pink);
            bottom: -25px;
            border-radius: 0 0 7px 7px;
        }

        .bow-ribbon-left  { left: 18px; transform: rotate(8deg); }
        .bow-ribbon-right { right: 18px; transform: rotate(-8deg); }

        .kitty-face {
            position: relative;
            width: 120px;
            height: 110px;
            margin: 0 auto 30px;
            animation: kittyBounce 2s ease-in-out infinite;
        }

        @keyframes kittyBounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        .kitty-head {
            position: absolute;
            width: 110px;
            height: 100px;
            background: white;
            border-radius: 50% 50% 45% 45%;
            border: 3px solid #333;
            top: 5px;
            left: 5px;
        }

        .kitty-ear-left, .kitty-ear-right {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 32px solid white;
            filter: drop-shadow(0 -1px 0 #333);
        }

        .kitty-ear-left  { top: -8px; left: 5px; transform: rotate(-15deg); }
        .kitty-ear-right { top: -8px; right: 5px; transform: rotate(15deg); }

        .kitty-ear-inner-left, .kitty-ear-inner-right {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid var(--pink);
        }

        .kitty-ear-inner-left  { top: 3px; left: -10px; }
        .kitty-ear-inner-right { top: 3px; right: -10px; }

        .kitty-bow-red {
            position: absolute;
            top: -10px;
            right: -10px;
            z-index: 2;
            animation: kittyBowWiggle 3s ease-in-out infinite;
        }

        @keyframes kittyBowWiggle {
            0%, 100% { transform: rotate(0deg); }
            25%      { transform: rotate(5deg); }
            75%      { transform: rotate(-5deg); }
        }

        .kitty-bow-red .b-left,
        .kitty-bow-red .b-right {
            position: absolute;
            width: 16px;
            height: 14px;
            background: var(--red);
            border-radius: 50%;
            top: 0;
        }

        .kitty-bow-red .b-left  { left: -14px; transform: rotate(-20deg); }
        .kitty-bow-red .b-right { left: 6px;  transform: rotate(20deg); }

        .kitty-bow-red .b-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffdd57;
            border-radius: 50%;
            top: 3px;
            left: -1px;
            z-index: 1;
        }

        .kitty-eye-left, .kitty-eye-right {
            position: absolute;
            width: 8px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            top: 42px;
        }

        .kitty-eye-left  { left: 32px; }
        .kitty-eye-right { right: 32px; }

        .kitty-nose {
            position: absolute;
            width: 10px;
            height: 8px;
            background: #f7c948;
            border-radius: 50%;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
        }

        .kitty-whisker {
            position: absolute;
            width: 30px;
            height: 1.5px;
            background: #999;
            border-radius: 1px;
        }

        .kw1 { top: 53px; left: 6px;  transform: rotate(5deg); }
        .kw2 { top: 58px; left: 4px;  transform: rotate(-5deg); }
        .kw3 { top: 63px; left: 6px;  transform: rotate(-10deg); }
        .kw4 { top: 53px; right: 6px; transform: rotate(-5deg); }
        .kw5 { top: 58px; right: 4px; transform: rotate(5deg); }
        .kw6 { top: 63px; right: 6px; transform: rotate(10deg); }

        .title {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b9d, #ff3d6f, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            animation: titleShine 3s ease-in-out infinite;
        }

        @keyframes titleShine {
            0%, 100% { filter: brightness(1); }
            50%      { filter: brightness(1.3); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .name-highlight {
            font-size: 2rem;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(255, 107, 157, 0.3);
            animation: namePulse 2s ease-in-out infinite;
        }

        @keyframes namePulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }

        .message {
            font-size: 1.15rem;
            color: #555;
            line-height: 2;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .message .emoji {
            font-size: 1.4rem;
        }

        .cake-section {
            margin: 10px 0 25px;
            position: relative;
        }

        .cake {
            position: relative;
            width: 140px;
            height: 120px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .cake:hover { transform: scale(1.08); }

        .cake-layer-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 40px;
            background: linear-gradient(180deg, #ffe0ec 0%, #ffb6d3 100%);
            border-radius: 12px 12px 4px 4px;
            border: 2px solid #e894a8;
        }

        .cake-layer-top {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 35px;
            background: linear-gradient(180deg, #fff5f8 0%, #ffe0ec 100%);
            border-radius: 10px 10px 3px 3px;
            border: 2px solid #e894a8;
        }

        .cake-cream-drip {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            width: 104px;
            height: 8px;
            background: #fff;
            border-radius: 0 0 10px 10px;
            z-index: 1;
        }

        .cake-cream-drip::before,
        .cake-cream-drip::after {
            content: '';
            position: absolute;
            bottom: -5px;
            width: 10px;
            height: 8px;
            background: #fff;
            border-radius: 0 0 6px 6px;
        }

        .cake-cream-drip::before { left: 18px; }
        .cake-cream-drip::after  { right: 18px; }

        /* ============================================
           精美数字蜡烛「22」— 核心样式
           ============================================ */

        /* 数字蜡烛容器 — 立在蛋糕奶油上 */
        .number-candles {
            position: absolute;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 3;
        }

        /* 单个数字蜡烛容器 — 微微摇曳 */
        .number-candle {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: candleSway 3.5s ease-in-out infinite;
        }

        /* 两个数字错开摇曳，更自然 */
        .number-candle:nth-child(2) {
            animation-delay: -1.75s;
        }

        @keyframes candleSway {
            0%, 100% { transform: rotate(-1.5deg); }
            50%      { transform: rotate(1.5deg); }
        }

        /* 数字本体 — 糖果条纹 + 光泽 + 立体感 */
        .number-body {
            position: relative;
            font-family: 'Arial Rounded MT Bold', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 46px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -1px;
            color: transparent;
            /* 双层背景：上层是光泽高光，下层是糖果条纹 */
            background-image:
                /* 光泽：顶部亮，中间通透，底部暗 */
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.75) 0%,
                    rgba(255, 255, 255, 0.25) 18%,
                    rgba(255, 255, 255, 0) 42%,
                    rgba(255, 255, 255, 0) 62%,
                    rgba(160, 30, 70, 0.25) 100%
                ),
                /* 糖果条纹（上下横向条纹，模拟生日蜡烛） */
                repeating-linear-gradient(
                    180deg,
                    #ff6b9d 0px,
                    #ff6b9d 7px,
                    #ffc4dc 7px,
                    #ffc4dc 14px
                );
            -webkit-background-clip: text;
            background-clip: text;
            /* 立体阴影 + 粉色外发光 */
            filter:
                drop-shadow(0 0 6px rgba(255, 107, 157, 0.85))
                drop-shadow(0 0 14px rgba(255, 107, 157, 0.45))
                drop-shadow(0 3px 3px rgba(160, 30, 70, 0.55));
            animation: candleGlow 2s ease-in-out infinite;
        }

        /* 数字呼吸发光 */
        @keyframes candleGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 6px rgba(255, 107, 157, 0.85))
                    drop-shadow(0 0 14px rgba(255, 107, 157, 0.45))
                    drop-shadow(0 3px 3px rgba(160, 30, 70, 0.55));
            }
            50% {
                filter:
                    drop-shadow(0 0 10px rgba(255, 107, 157, 1))
                    drop-shadow(0 0 22px rgba(255, 107, 157, 0.7))
                    drop-shadow(0 3px 3px rgba(160, 30, 70, 0.65));
            }
        }

        /* 数字底部的小蜡座（像真蜡烛插在蛋糕上） */
        .number-candle::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 5px;
            background: radial-gradient(ellipse, rgba(180, 60, 110, 0.55), transparent 70%);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* ==================== 火焰 ==================== */
        /* 三层火焰：外层光晕 + 主体 + 白热内芯 */
        .number-candle .flame {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 26px;
            background: radial-gradient(
                ellipse 60% 75% at 50% 82%,
                #ffffff 0%,
                #fff8d0 12%,
                #ffe066 32%,
                #ff9a1f 58%,
                #ff4500 82%,
                rgba(255, 69, 0, 0) 100%
            );
            border-radius: 50% 50% 40% 40% / 62% 62% 38% 38%;
            animation: flameFlicker 0.28s ease-in-out infinite alternate;
            /* 火焰整体外发光 */
            filter:
                drop-shadow(0 0 8px rgba(255, 210, 80, 0.95))
                drop-shadow(0 0 16px rgba(255, 150, 40, 0.7));
            z-index: 2;
        }

        /* 火焰外圈光晕（会呼吸） */
        .number-candle .flame::before {
            content: '';
            position: absolute;
            inset: -18px;
            background: radial-gradient(
                circle at 50% 65%,
                rgba(255, 220, 100, 0.55) 0%,
                rgba(255, 160, 50, 0.28) 40%,
                rgba(255, 120, 20, 0.1) 60%,
                transparent 75%
            );
            border-radius: 50%;
            animation: flameHalo 1.2s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: -1;
        }

        /* 火焰内芯（最亮的一点白热） */
        .number-candle .flame::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 10px;
            background: radial-gradient(ellipse, #ffffff 0%, #fffbe0 50%, transparent 100%);
            border-radius: 50%;
            filter: blur(0.5px);
        }

        @keyframes flameFlicker {
            0%   { transform: translateX(-50%) scale(1, 1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(0.9, 1.15) rotate(2.5deg); }
        }

        @keyframes flameHalo {
            0%   { opacity: 0.6; transform: scale(0.92); }
            100% { opacity: 1;   transform: scale(1.1); }
        }

        /* ============================================ */

        .cake-plate {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 10px;
            background: #f0e0e8;
            border-radius: 50%;
            border: 2px solid #dcc8d4;
        }

        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 1px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ff3d6f);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 61, 111, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 61, 111, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #ff6b9d;
            border: 2px solid #ffb6d3;
        }

        .btn-secondary:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.2);
        }

        /* ========== 气球样式（已修复） ========== */
        .balloon {
            position: fixed;
            bottom: -120px;
            z-index: 9999;
            animation: balloonRise linear forwards;
            opacity: 0.85;
            pointer-events: none;
        }

        @keyframes balloonRise {
            0%   { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }

        .spark-burst {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        .spark-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: sparkFly 0.8s ease-out forwards;
        }

        @keyframes sparkFly {
            0%   { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 40px 20px 30px; border-radius: 24px; }
            .title { font-size: 1.8rem; }
            .name-highlight { font-size: 1.5rem; }
            .message { font-size: 1rem; }
            .btn { padding: 12px 24px; font-size: 0.95rem; }
            .kitty-face { transform: scale(0.8); }
            .bow-wrapper { top: -40px; }
            .bow { transform: scale(0.75); }
            /* 手机端数字蜡烛稍微缩小 */
            .number-body { font-size: 36px; }
            .number-candles { gap: 10px; bottom: 62px; }
            .number-candle .flame { width: 13px; height: 21px; top: -24px; }
        }

        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <span class="floating-icon">&#x1F380;</span>
        <span class="floating-icon">&#x1F338;</span>
        <span class="floating-icon">&#x1F382;</span>
        <span class="floating-icon">&#x1F496;</span>
        <span class="floating-icon">&#x2728;</span>
        <span class="floating-icon">&#x1F370;</span>
        <span class="floating-icon">&#x1F388;</span>
        <span class="floating-icon">&#x1F9C1;</span>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <div class="main-container">
        <div class="card">
            <div class="bow-wrapper">
                <div class="bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                    <div class="bow-ribbon-left"></div>
                    <div class="bow-ribbon-right"></div>
                </div>
            </div>

            <div class="kitty-face">
                <div class="kitty-ear-left">
                    <div class="kitty-ear-inner-left"></div>
                </div>
                <div class="kitty-ear-right">
                    <div class="kitty-ear-inner-right"></div>
                </div>
                <div class="kitty-head"></div>
                <div class="kitty-bow-red">
                    <div class="b-left"></div>
                    <div class="b-right"></div>
                    <div class="b-dot"></div>
                </div>
                <div class="kitty-eye-left"></div>
                <div class="kitty-eye-right"></div>
                <div class="kitty-nose"></div>
                <div class="kitty-whisker kw1"></div>
                <div class="kitty-whisker kw2"></div>
                <div class="kitty-whisker kw3"></div>
                <div class="kitty-whisker kw4"></div>
                <div class="kitty-whisker kw5"></div>
                <div class="kitty-whisker kw6"></div>
            </div>

                &#x795D;&#x4F60; <strong>&#x751F;&#x65E5;&#x5FEB;&#x4E50;</strong>&#xFF01;<br>
                <span class="emoji">&#x1F381;</span> &#x613F;&#x4F60;&#x7684;&#x6BCF;&#x4E00;&#x5929;&#x90FD;&#x50CF;&#x8349;&#x8393;&#x86CB;&#x7CD5;&#x4E00;&#x6837;&#x751C;<br>
                &#x50CF;&#x5F69;&#x8679;&#x4E00;&#x6837;&#x7EDA;&#x70C2;&#x591A;&#x5F69;<br>
                <span class="emoji">&#x1F308;</span> &#x613F;&#x4F60;&#x6C38;&#x8FDC;&#x53EF;&#x7231;&#x3001;&#x6C38;&#x8FDC;&#x88AB;&#x7231;<br>
                &#x6C38;&#x8FDC;&#x662F;&#x90A3;&#x4E2A;&#x95EA;&#x95EA;&#x53D1;&#x5149;&#x7684;&#x5C0F;&#x5357;&#x74DC;&#xFF01;<br>
                <span class="emoji">&#x1F49D;</span> <strong>Happy Birthday!</strong>

            <div class="cake-section">
                <div class="cake" id="birthdayCake" title="&#x70B9;&#x51FB;&#x5439;&#x8721;&#x70DB; &#x1F382;">
                    <!-- 精美数字蜡烛 22 -->
                    <div class="number-candles">
                        <div class="number-candle">
                            <div class="flame"></div>
                            <div class="number-body">2</div>
                        </div>
                        <div class="number-candle">
                            <div class="flame"></div>
                            <div class="number-body">2</div>
                        </div>
                    </div>

                    <div class="cake-cream-drip"></div>
                    <div class="cake-layer-top"></div>
                    <div class="cake-layer-bottom"></div>
                    <div class="cake-plate"></div>

                <button class="btn btn-primary" id="btnCelebrate">&#x1F389; &#x653E;&#x70DF;&#x82B1;&#x5E86;&#x795D;</button>
                <button class="btn btn-secondary" id="btnBalloons">&#x1F388; &#x653E;&#x98DE;&#x6C14;&#x7403;</button>

    <script>
        const TOTAL_CONFETTI = 50;
        const confettiColors = ['#ff6b9d', '#ffb6d3', '#ffe066', '#ff8c00', '#ff3d6f', '#c084fc', '#67e8f9', '#fda4af', '#fde047', '#86efac'];

        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            for (let i = 0; i < TOTAL_CONFETTI; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.width = (6 + Math.random() * 14) + 'px';
                el.style.height = (6 + Math.random() * 14) + 'px';
                el.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                el.style.animationDuration = (6 + Math.random() * 12) + 's';
                el.style.animationDelay = Math.random() * 10 + 's';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                container.appendChild(el);
            }
        }

        function createSparkBurst(x, y, count = 40) {
            const container = document.createElement('div');
            container.className = 'spark-burst';
            container.style.left = x + 'px';
            container.style.top = y + 'px';

            const colors = ['#ff6b9d', '#ffe066', '#ff8c00', '#c084fc', '#67e8f9', '#fda4af', '#ff3d6f', '#fff'];

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'spark-particle';
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const distance = 40 + Math.random() * 80;
                particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (3 + Math.random() * 8) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (0.5 + Math.random() * 0.7) + 's';
                container.appendChild(particle);
            }

            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1000);
        }

        function releaseBalloons(count = 15) {
            const balloonEmojis = ['\u{1F388}', '\u{1F380}', '\u{1F49D}', '\u{1F381}', '\u{1F338}', '\u{1F496}'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.textContent = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
                    balloon.style.fontSize = (2 + Math.random() * 3) + 'rem';
                    balloon.style.left = (5 + Math.random() * 90) + '%';

                    const duration = 3 + Math.random() * 5;
                    balloon.style.animationDuration = duration + 's';

                    document.body.appendChild(balloon);
                    setTimeout(() => balloon.remove(), duration * 1000 + 500);
                }, i * 200);
            }
        }

        function celebrate() {
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const x = 50 + Math.random() * window.innerWidth * 0.6;
                    const y = 80 + Math.random() * window.innerHeight * 0.5;
                    createSparkBurst(x, y, 35 + Math.floor(Math.random() * 30));
                }, i * 250);
            }
            releaseBalloons(10);
        }

        let candleLit = true;
        const flames = document.querySelectorAll('.flame');
        const cake = document.getElementById('birthdayCake');

        cake.addEventListener('click', () => {
            if (candleLit) {
                flames.forEach(f => f.style.display = 'none');
                candleLit = false;
                const rect = cake.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + 20;
                createSparkBurst(cx, cy, 30);
                releaseBalloons(8);
            } else {
                flames.forEach(f => f.style.display = '');
                candleLit = true;
            }
        });

        document.getElementById('btnCelebrate').addEventListener('click', celebrate);
        document.getElementById('btnBalloons').addEventListener('click', () => releaseBalloons(20));

        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BODY' || e.target.classList.contains('bg-decorations') || e.target.classList.contains('main-container')) {
                createSparkBurst(e.clientX, e.clientY, 12);
            }
        });

        createConfetti();

        setTimeout(() => releaseBalloons(5), 1500);

        console.log('\u{1F380} 欢迎来到小南瓜的 Hello Kitty 生日派对！');
        console.log('\u{1F49D} Happy Birthday 小南瓜！愿你天天开心！');
    </script>
</body>
