<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 Happy Birthday 小南瓜！🎀</title>
    <style>
        :root {
            --pink: #ff6b9d;
            --light-pink: #ffb6d3;
            --lighter-pink: #ffe0ec;
            --white: #ffffff;
            --yellow: #ffe066;
            --red: #ff4444;
            --bg: #fff5f8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffe0ec 0%, #fff0f5 30%, #ffe0ec 60%, #ffd1e0 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================
           多阶段拆礼物遮罩层
           ★ 修改1：遮罩向外扩 40px，震动时不会露出下方贺卡
           ========================================== */
        .welcome-overlay {
            position: fixed;
            top: -40px; left: -40px;
            width: calc(100vw + 80px);
            height: calc(100vh + 80px);
            background: linear-gradient(135deg, #ffe0ec 0%, #fff0f5 30%, #ffe0ec 60%, #ffd1e0 100%);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .welcome-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .stage {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }
        .stage.active { opacity: 1; visibility: visible; }

        /* --- 阶段1：22个精美气球 --- */
        .balloon-item {
            position: absolute;
            width: 55px;
            height: 72px;
            cursor: pointer;
            animation: balloonSway 3s ease-in-out infinite alternate;
            z-index: 10;
            transition: transform 0.2s, opacity 0.2s;
        }
        .balloon-item:hover { transform: scale(1.15); }
        .balloon-body {
            width: 100%; height: 100%;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
        }
        .balloon-body::before {
            content: '';
            position: absolute;
            top: 12%; left: 18%;
            width: 28%; height: 22%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: rotate(-30deg);
            filter: blur(1px);
        }
        .balloon-body::after {
            content: '';
            position: absolute;
            top: 30%; right: 15%;
            width: 12%; height: 35%;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            filter: blur(1px);
        }
        .balloon-string {
            position: absolute;
            bottom: -22px; left: 50%;
            transform: translateX(-50%);
            width: 1.5px; height: 22px;
            background: rgba(180, 150, 160, 0.5);
            border-radius: 1px;
        }
        @keyframes balloonSway {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        /* ==========================================
           阶段2：精美立体礼物盒
           ========================================== */
        .gift-box {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            animation: giftShake 2s ease-in-out infinite;
            transform-origin: bottom center;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s;
        }
        .gift-box.opened {
            animation: none;
            transform: scale(1.15);
        }

        .gift-shadow {
            position: absolute;
            bottom: -18px; left: 50%;
            transform: translateX(-50%);
            width: 190px; height: 22px;
            background: radial-gradient(ellipse, rgba(180, 60, 110, 0.5), transparent 70%);
            border-radius: 50%;
            filter: blur(6px);
            animation: shadowPulse 2s ease-in-out infinite;
        }

        .gift-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(255, 240, 200, 0.9), rgba(255, 200, 120, 0.4) 40%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 2s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        /* 旋转光芒 */
        .gift-rays {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 420px; height: 420px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg, rgba(255, 220, 100, 0.18) 15deg, transparent 30deg,
                transparent 60deg, rgba(255, 220, 100, 0.18) 75deg, transparent 90deg,
                transparent 120deg, rgba(255, 220, 100, 0.18) 135deg, transparent 150deg,
                transparent 180deg, rgba(255, 220, 100, 0.18) 195deg, transparent 210deg,
                transparent 240deg, rgba(255, 220, 100, 0.18) 255deg, transparent 270deg,
                transparent 300deg, rgba(255, 220, 100, 0.18) 315deg, transparent 330deg
            );
            border-radius: 50%;
            animation: raysRotate 20s linear infinite;
            pointer-events: none;
            z-index: -1;
            opacity: 0.7;
        }
        @keyframes raysRotate {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .gift-sparkle {
            position: absolute;
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffe066, 0 0 20px #ffcc33;
            animation: sparkleTwinkle 2s ease-in-out infinite;
            z-index: 20;
        }

        /* 盒盖 */
        .gift-lid {
            position: absolute;
            top: 0; left: -12px;
            width: 224px; height: 55px;
            background: linear-gradient(180deg, #ff8fab 0%, #ff6b9d 50%, #ff3d6f 100%);
            border-radius: 12px 12px 6px 6px;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.7),
                inset 0 -4px 8px rgba(160, 30, 70, 0.35),
                0 8px 20px rgba(255, 61, 111, 0.45);
            z-index: 3;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.9s;
        }
        .gift-lid::before {
            content: '';
            position: absolute;
            top: 4px; left: 8px; right: 8px;
            height: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), transparent);
            border-radius: 8px 8px 0 0;
            pointer-events: none;
        }
        .gift-box.opened .gift-lid {
            transform: translateY(-400px) rotate(45deg) scale(0.6);
            opacity: 0;
        }

        .gift-lid-ribbon {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 26px;
            background: linear-gradient(90deg, #fff8d0, #ffe066 40%, #ffcc33 60%, #ffe066 100%);
            box-shadow:
                inset 0 0 6px rgba(255, 200, 60, 0.9),
                0 0 12px rgba(255, 220, 100, 0.6);
            border-radius: 2px;
        }

        /* ==========================================
           ★ 修改2：全新精美蝴蝶结（干净通透的金色质感）
           ========================================== */
        .gift-bow {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 190px;
            height: 118px;
            z-index: 5;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s;
            filter: drop-shadow(0 10px 14px rgba(190, 130, 0, 0.32));
        }
        .gift-box.opened .gift-bow {
            transform: translateX(-50%) translateY(-300px) scale(0.6) rotate(-30deg);
            opacity: 0;
        }

        /* ★ 全新飘带：从结下自然垂出，底端收窄，不再像两个方块 */
        .bow-tail {
            position: absolute;
            top: 50px;
            width: 26px;
            height: 56px;
            background: linear-gradient(180deg, #ffe680 0%, #ffd23f 35%, #f5ab00 72%, #d99500 100%);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            z-index: 1;
        }
        .bow-tail-left {
            left: 57px;
            transform: rotate(-9deg);
            transform-origin: top center;
        }
        .bow-tail-right {
            right: 57px;
            transform: rotate(9deg);
            transform-origin: top center;
        }

        /* ★ 左右蝴蝶结大环：圆润饱满，光泽通透 */
        .bow-loop {
            position: absolute;
            top: 2px;
            width: 88px;
            height: 68px;
            background:
                radial-gradient(ellipse 62% 46% at 32% 22%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 65%),
                linear-gradient(150deg, #fff7c9 0%, #ffe066 20%, #ffc61a 52%, #f0a800 78%, #cf8a00 100%);
            box-shadow:
                inset -5px -8px 16px rgba(170, 110, 0, 0.30),
                inset 6px 6px 14px rgba(255, 255, 255, 0.55);
            z-index: 2;
        }
        .bow-loop-left {
            left: 2px;
            border-radius: 68% 32% 46% 54% / 72% 70% 30% 28%;
            transform: rotate(-18deg);
            transform-origin: 90% 55%;
        }
        .bow-loop-right {
            right: 2px;
            border-radius: 32% 68% 54% 46% / 70% 72% 28% 30%;
            transform: rotate(18deg);
            transform-origin: 10% 55%;
        }

        /* ★ 中央圆球：正圆形金球，带高光 */
        .bow-knot {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 46px;
            background: radial-gradient(circle at 34% 28%, #fffde8 0%, #ffe680 32%, #ffc61a 64%, #d99500 100%);
            border-radius: 50%;
            box-shadow:
                inset -3px -4px 10px rgba(150, 95, 0, 0.42),
                inset 3px 4px 10px rgba(255, 255, 255, 0.70),
                0 5px 12px rgba(180, 120, 0, 0.40);
            z-index: 4;
        }
        .bow-knot::before {
            content: '';
            position: absolute;
            top: 7px;
            left: 11px;
            width: 17px;
            height: 13px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.95), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 盒身 */
        .gift-body {
            position: absolute;
            bottom: 0; left: 0;
            width: 200px; height: 145px;
            background: linear-gradient(180deg, #ff7aac 0%, #ff5a8b 50%, #ff3d6f 100%);
            border-radius: 8px 8px 18px 18px;
            box-shadow:
                inset 0 4px 10px rgba(255, 255, 255, 0.35),
                inset 0 -10px 22px rgba(150, 20, 60, 0.45),
                0 15px 35px rgba(255, 61, 111, 0.5);
            z-index: 1;
            overflow: hidden;
            transition: transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.7s;
        }
        .gift-box.opened .gift-body {
            transform: scale(0.3) translateY(20px);
            opacity: 0;
        }
        .gift-body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent);
            pointer-events: none;
        }
        .gift-body::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(0deg, rgba(120, 20, 60, 0.35), transparent);
            pointer-events: none;
        }

        .gift-body-ribbon-v {
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 26px;
            background: linear-gradient(90deg, #fff8d0, #ffe066 40%, #ffcc33 60%, #ffe066 100%);
            box-shadow:
                inset 0 0 8px rgba(255, 200, 60, 0.9),
                0 0 14px rgba(255, 220, 100, 0.6);
        }

        .gift-text {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(120, 20, 60, 0.7);
            z-index: 2;
            white-space: nowrap;
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes giftShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-2.5deg) scale(1.02); }
            75% { transform: rotate(2.5deg) scale(1.02); }
        }
        @keyframes shadowPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.7; }
            50% { transform: translateX(-50%) scale(0.9); opacity: 0.4; }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        @keyframes textPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        /* ==========================================
           拆礼物“哇”特效
           ========================================== */
        .open-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center,
                #ffffff 0%,
                rgba(255, 245, 210, 0.95) 15%,
                rgba(255, 220, 120, 0.6) 35%,
                rgba(255, 180, 80, 0.2) 55%,
                transparent 75%);
            pointer-events: none;
            z-index: 10002;
            opacity: 0;
            animation: openFlashAnim 1s ease-out forwards;
        }
        @keyframes openFlashAnim {
            0% { opacity: 0; }
            10% { opacity: 1; }
            100% { opacity: 0; }
        }

        .open-ring {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 0; height: 0;
            border-radius: 50%;
            border: 4px solid rgba(255, 220, 100, 0.9);
            box-shadow:
                0 0 40px rgba(255, 220, 100, 1),
                inset 0 0 40px rgba(255, 220, 100, 0.7);
            pointer-events: none;
            z-index: 10001;
            opacity: 0;
            animation: openRingAnim 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes openRingAnim {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 200vmax; height: 200vmax; opacity: 0; }
        }

        .open-beam {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; height: 30px;
            background: radial-gradient(ellipse,
                rgba(255, 245, 200, 1) 0%,
                rgba(255, 220, 100, 0.9) 30%,
                rgba(255, 200, 50, 0.4) 60%,
                transparent 85%);
            border-radius: 50%;
            filter: blur(20px);
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            animation: openBeamAnim 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes openBeamAnim {
            0% { width: 30px; height: 30px; opacity: 0; }
            15% { opacity: 1; }
            60% { width: 80vmax; height: 80vmax; opacity: 0.9; }
            100% { width: 160vmax; height: 160vmax; opacity: 0; }
        }

        /* 华丽气球爆破特效 */
        .pop-ring {
            position: fixed;
            border-radius: 50%;
            border: 3px solid #fff;
            pointer-events: none;
            z-index: 9999;
            animation: popRingExpand 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
        }
        @keyframes popRingExpand {
            0% { width: 0; height: 0; opacity: 1; transform: translate(-50%, -50%); }
            100% { width: 180px; height: 180px; opacity: 0; transform: translate(-50%, -50%); }
        }

        .pop-flash {
            position: fixed;
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            animation: popFlash 0.4s ease-out forwards;
        }
        @keyframes popFlash {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
        }

        .pop-debris {
            position: fixed;
            width: 10px; height: 10px;
            border-radius: 50% 50% 50% 0;
            pointer-events: none;
            z-index: 9999;
            animation: popDebris 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes popDebris {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(720deg) scale(0.3); opacity: 0; }
        }

        /* ★ 修改3：震动幅度收窄，配合加大的遮罩，绝不露底 */
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 3px); }
            40% { transform: translate(4px, -4px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(2px, 3px); }
        }
        .shake-active { animation: screenShake 0.4s ease-out; }

        .welcome-text {
            font-size: 1.2rem;
            color: #ff6b9d;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .welcome-subtext {
            font-size: 1rem;
            color: #ff8cb3;
        }

        /* 其余样式 */
        .bg-decorations {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-icon {
            position: absolute;
            opacity: 0.3;
            animation: floatAround 15s infinite ease-in-out;
            font-size: 3rem;
            user-select: none;
        }
        .floating-icon:nth-child(1)  { top: 5%;  left: 5%;  animation-delay: 0s; animation-duration: 14s; }
        .floating-icon:nth-child(2)  { top: 8%;  left: 85%; animation-delay: -3s; animation-duration: 18s; }
        .floating-icon:nth-child(3)  { top: 70%; left: 90%; animation-delay: -7s; animation-duration: 16s; }
        .floating-icon:nth-child(4)  { top: 80%; left: 10%; animation-delay: -5s; animation-duration: 20s; }
        .floating-icon:nth-child(5)  { top: 50%; left: 50%; animation-delay: -2s; animation-duration: 13s; font-size: 2rem; }
        .floating-icon:nth-child(6)  { top: 15%; left: 45%; animation-delay: -9s; animation-duration: 17s; font-size: 2.5rem; }
        .floating-icon:nth-child(7)  { top: 85%; left: 75%; animation-delay: -4s; animation-duration: 19s; }
        .floating-icon:nth-child(8)  { top: 40%; left: 20%; animation-delay: -6s; animation-duration: 15s; font-size: 2rem; }
        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25%      { transform: translate(30px, -40px) rotate(8deg) scale(1.1); }
            50%      { transform: translate(-20px, -15px) rotate(-5deg) scale(0.9); }
            75%      { transform: translate(-35px, 30px) rotate(6deg) scale(1.05); }
        }
        .confetti-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 12px; height: 12px;
            border-radius: 3px;
            animation: confettiFall linear infinite;
            opacity: 0.8;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(-120px) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.3); opacity: 0; }
        }
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 107, 157, 0.2), 0 0 0 3px rgba(255, 182, 211, 0.4), inset 0 0 40px rgba(255, 182, 211, 0.1);
            animation: cardAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: visible;
        }
        @keyframes cardAppear {
            0%   { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.05) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* ========== 主卡片顶部蝴蝶结隐藏 ========== */
        .bow-wrapper { display: none !important; }

        .kitty-face { position: relative; width: 120px; height: 110px; margin: 0 auto 30px; animation: kittyBounce 2s ease-in-out infinite; cursor: pointer; }
        @keyframes kittyBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .kitty-head { position: absolute; width: 110px; height: 100px; background: white; border-radius: 50% 50% 45% 45%; border: 3px solid #333; top: 5px; left: 5px; }
        .kitty-ear-left, .kitty-ear-right { position: absolute; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 32px solid white; filter: drop-shadow(0 -1px 0 #333); }
        .kitty-ear-left  { top: -8px; left: 5px; transform: rotate(-15deg); }
        .kitty-ear-right { top: -8px; right: 5px; transform: rotate(15deg); }
        .kitty-ear-inner-left, .kitty-ear-inner-right { position: absolute; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 18px solid var(--pink); }
        .kitty-ear-inner-left  { top: 3px; left: -10px; }
        .kitty-ear-inner-right { top: 3px; right: -10px; }
        .kitty-bow-red { position: absolute; top: -10px; right: -10px; z-index: 2; animation: kittyBowWiggle 3s ease-in-out infinite; }
        @keyframes kittyBowWiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }

    <script>
        const TOTAL_CONFETTI = 50;
        const confettiColors = ['#ff6b9d', '#ffb6d3', '#ffe066', '#ff8c00', '#ff3d6f', '#c084fc', '#67e8f9', '#fda4af', '#fde047', '#86efac'];

        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            for (let i = 0; i < TOTAL_CONFETTI; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.width = (6 + Math.random() * 14) + 'px';
                el.style.height = (6 + Math.random() * 14) + 'px';
                el.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                el.style.animationDuration = (6 + Math.random() * 12) + 's';
                el.style.animationDelay = Math.random() * 10 + 's';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                container.appendChild(el);
            }
        }

        function createSparkBurst(x, y, count = 40) {
            const container = document.createElement('div');
            container.className = 'spark-burst';
            container.style.left = x + 'px';
            container.style.top = y + 'px';
            const colors = ['#ff6b9d', '#ffe066', '#ff8c00', '#c084fc', '#67e8f9', '#fda4af', '#ff3d6f', '#fff'];
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'spark-particle';
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const distance = 40 + Math.random() * 80;
                particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (3 + Math.random() * 8) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = (0.5 + Math.random() * 0.7) + 's';
                container.appendChild(particle);
            }
            document.body.appendChild(container);
            setTimeout(() => container.remove(), 1000);
        }

        function releaseBalloons(count = 15) {
            const balloonEmojis = ['🎈', '🎀', '💝', '🎁', '🌹', '💖'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.textContent = balloonEmojis[Math.floor(Math.random() * balloonEmojis.length)];
                    balloon.style.fontSize = (2 + Math.random() * 3) + 'rem';
                    balloon.style.left = (5 + Math.random() * 90) + '%';
                    const duration = 3 + Math.random() * 5;
                    balloon.style.animationDuration = duration + 's';
                    document.body.appendChild(balloon);
                    setTimeout(() => balloon.remove(), duration * 1000 + 500);
                }, i * 200);
            }
        }

        function celebrate() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = 50 + Math.random() * (window.innerWidth - 100);
                    const y = 80 + Math.random() * (window.innerHeight * 0.6);
                    createSparkBurst(x, y, 60 + Math.floor(Math.random() * 40));
                }, i * 150);
            }
            releaseBalloons(20);
        }

        const popColors = ['#ff6b9d', '#ffb6d3', '#ffe066', '#ff8c00', '#ff3d6f', '#c084fc', '#67e8f9', '#fda4af', '#fde047', '#86efac', '#a1c4fd'];

        function createPopEffect(x, y) {
            const ring = document.createElement('div');
            ring.className = 'pop-ring';
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            const ringColor = popColors[Math.floor(Math.random() * popColors.length)];
            ring.style.color = ringColor;
            ring.style.borderColor = ringColor;
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 700);

            const flash = document.createElement('div');
            flash.className = 'pop-flash';
            flash.style.left = x + 'px';
            flash.style.top = y + 'px';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 400);

            const particleCount = 15 + Math.floor(Math.random() * 10);
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = (4 + Math.random() * 6) + 'px';
                particle.style.height = particle.style.width;
                particle.style.borderRadius = '50%';
                particle.style.background = popColors[Math.floor(Math.random() * popColors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                particle.style.boxShadow = '0 0 8px currentColor';
                particle.style.color = particle.style.background;
                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 120;
                particle.style.transition = `transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s ease-out`;
                document.body.appendChild(particle);
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0.3)`;
                    particle.style.opacity = '0';
                });
                setTimeout(() => particle.remove(), 950);
            }

            for (let i = 0; i < 5; i++) {
                const debris = document.createElement('div');
                debris.className = 'pop-debris';
                debris.style.left = x + 'px';
                debris.style.top = y + 'px';
                debris.style.background = popColors[Math.floor(Math.random() * popColors.length)];
                const angle = (Math.PI * 2 * i) / 8 + (Math.random() - 0.5) * 0.5;
                const distance = 80 + Math.random() * 80;
                debris.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                debris.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                document.body.appendChild(debris);
                setTimeout(() => debris.remove(), 1000);
            }
        }

        function shakeScreen() {
            // 只震动顶部的欢迎遮罩，不会带动下方贺卡
            welcomeOverlay.classList.add('shake-active');
            setTimeout(() => welcomeOverlay.classList.remove('shake-active'), 400);
        }

                // 气球爆破音效（合成“啵”声）
        function playPopSound() {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        // 点击气球随机飘出文字
        function showPopText(x, y) {
            const texts = ['✨', '🎉', '💥', '🎈', '💖', 'Nan！', '楠！'];
            const el = document.createElement('div');
            el.textContent = texts[Math.floor(Math.random() * texts.length)];
            el.style.position = 'fixed';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = '1.4rem';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '10001';
            el.style.animation = 'floatUp 0.8s ease-out forwards';
            el.style.color = '#ff3d6f';  // 深粉色
            el.style.fontWeight = 'bold';
            el.style.textShadow = '0 0 8px rgba(255, 107, 157, 0.8)';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }
            // 同时存在的烟花数量限制
        let activeFireworks = 0;
        const MAX_FIREWORKS = 4;
                // ==================== 全屏礼炮 + 烟花特效 ====================
        function launchFirework(startX, startY) {
            // 超过上限就跳过，防止连点卡顿
            if (activeFireworks >= MAX_FIREWORKS) return;
            activeFireworks++;

            const colors = ['#ff6b9d', '#ffe066', '#ff8c00', '#c084fc', '#67e8f9', '#fda4af', '#ff3d6f', '#86efac', '#fff'];
            // 1. 从底部发射一颗“炮弹”到目标位置
            const shell = document.createElement('div');
            shell.style.position = 'fixed';
            shell.style.left = startX + 'px';
            shell.style.bottom = '0px';
            shell.style.width = '6px';
            shell.style.height = '6px';
            shell.style.borderRadius = '50%';
            shell.style.background = '#fff';
            shell.style.boxShadow = '0 0 12px #fff, 0 0 24px #ffe066';
            shell.style.pointerEvents = 'none';
            shell.style.zIndex = '10003';
            shell.style.transition = 'bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1), left 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
            document.body.appendChild(shell);

            // 拖尾
            const trailInterval = setInterval(() => {
                const trail = document.createElement('div');
                trail.style.position = 'fixed';
                trail.style.left = shell.style.left;
                trail.style.bottom = shell.style.bottom;
                trail.style.width = '4px';
                trail.style.height = '4px';
                trail.style.borderRadius = '50%';
                trail.style.background = '#ffe066';
                trail.style.boxShadow = '0 0 8px #ffe066';
                trail.style.pointerEvents = 'none';
                trail.style.zIndex = '10002';
                trail.style.transition = 'opacity 0.5s';
                document.body.appendChild(trail);
                setTimeout(() => { trail.style.opacity = '0'; }, 50);
                setTimeout(() => trail.remove(), 600);
            }, 30);

            // 飞向目标
            requestAnimationFrame(() => {
                shell.style.left = startX + 'px';
                shell.style.bottom = (window.innerHeight - startY) + 'px';
            });

            // 到达后爆炸
            setTimeout(() => {
                clearInterval(trailInterval);
                shell.remove();
                explodeFirework(startX, startY, colors);
            }, 620);
        }

        // 烟花爆炸
        function explodeFirework(x, y, colors) {
            // 中心闪光
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.left = x + 'px';
            flash.style.top = y + 'px';
            flash.style.width = '100px';
            flash.style.height = '100px';
            flash.style.transform = 'translate(-50%, -50%)';
            flash.style.background = 'radial-gradient(circle, #fff 0%, rgba(255,220,100,0.8) 30%, transparent 70%)';
            flash.style.borderRadius = '50%';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '10003';
            flash.style.animation = 'fireworkFlash 0.4s ease-out forwards';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 1300);

            // 三层粒子
            const layers = [
                { count: 24, distance: 180, size: 7 },
                { count: 14, distance: 110, size: 5 }
            ];

            layers.forEach(layer => {
                for (let i = 0; i < layer.count; i++) {
                    const particle = document.createElement('div');
                    const angle = (Math.PI * 2 * i) / layer.count + (Math.random() - 0.5) * 0.3;
                    const dist = layer.distance * (0.6 + Math.random() * 0.5);
                    const dx = Math.cos(angle) * dist;
                    const dy = Math.sin(angle) * dist;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = layer.size * (0.6 + Math.random() * 0.8);

                    particle.style.position = 'fixed';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.borderRadius = '50%';
                    particle.style.background = color;
                    particle.style.boxShadow = `0 0 ${size * 2}px ${color}, 0 0 ${size * 4}px ${color}`;
                    particle.style.pointerEvents = 'none';
                    particle.style.zIndex = '10002';
                    particle.style.transition = `transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease-out`;
                    document.body.appendChild(particle);

                    requestAnimationFrame(() => {
                        particle.style.transform = `translate(${dx}px, ${dy}px) scale(0.2)`;
                        particle.style.opacity = '0';
                    });
                    setTimeout(() => particle.remove(), 1250);
                }
            });

            // 音效（爆炸“砰”声）
            try {
                const ctx = getAudioContext();
                if (ctx.state === 'suspended') ctx.resume();
                // 低频爆炸声
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch (e) {}
        }

        // 配套的闪光动画
        const fireworkStyle = document.createElement('style');
        fireworkStyle.textContent = `
            @keyframes fireworkFlash {
                0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
            }
        `;
        document.head.appendChild(fireworkStyle);

        // 配套的飘浮动画
        const styleSheet = document.createElement('style');

        document.head.appendChild(styleSheet);

        /* ==========================================
           拆礼物“哇”特效

        function giftOpenWow(centerX, centerY) {
            // 1. 全屏白光闪烁
            const flash = document.createElement('div');
            flash.className = 'open-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 1100);

            // 2. 三层冲击波圆环
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ring = document.createElement('div');

                    document.body.appendChild(ring);
                    setTimeout(() => ring.remove(), 1400);
                }, i * 120);
            }

            // 3. 中心柔光
            const beam = document.createElement('div');

            for (let i = 0; i < 80; i++) {

                particle.style.height = size + 'px';

                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '10001';
                particle.style.boxShadow = '0 0 12px #ffd54a, 0 0 24px #ffa500';
                document.body.appendChild(particle);
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 400;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - 200;
                particle.style.transition = `transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease-out`;
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${dx}px, ${dy}px) scale(0.2) rotate(${Math.random() * 720}deg)`;
                    particle.style.opacity = '0';

                setTimeout(() => particle.remove(), 1600);

        }

        // ==================== 阶段交互逻辑 ====================
        const stageBalloon = document.getElementById('stageBalloon');
        const stageGift = document.getElementById('stageGift');
        const stageCandle = document.getElementById('stageCandle');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const giftBox = document.getElementById('giftBox');

        let poppedCount = 0;
        const TOTAL_BALLOONS = 22;

        const balloonGradients = [
            ['#ff9a9e', '#fecfef'],
            ['#a1c4fd', '#c2e9fb'],
            ['#fbc2eb', '#a6c1ee'],
            ['#fddb92', '#d1fdff'],
            ['#84fab0', '#8fd3f4'],
            ['#ffecd2', '#fcb69f'],
            ['#ff6b9d', '#ffb6d3'],
            ['#c084fc', '#e9d5ff']
        ];

        function initBalloons() {
            const existingBalloons = stageBalloon.querySelectorAll('.balloon-item');
            existingBalloons.forEach(b => b.remove());

            for (let i = 0; i < TOTAL_BALLOONS; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon-item';
                const colors = balloonGradients[Math.floor(Math.random() * balloonGradients.length)];
                const body = document.createElement('div');
                body.className = 'balloon-body';
                body.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
                const string = document.createElement('div');
                string.className = 'balloon-string';
                balloon.appendChild(body);
                balloon.appendChild(string);

                balloon.style.top = (12 + Math.random() * 60) + '%';
                balloon.style.left = (5 + Math.random() * 64) + '%';
                balloon.style.animationDelay = (Math.random() * -3) + 's';
                const scale = 0.7 + Math.random() * 0.5;
                balloon.style.transform = `scale(${scale})`;

                                balloon.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playPopSound();               // 播放“啵”音效
                    showPopText(e.clientX, e.clientY); // 【新增】飘出随机文字
                    if (navigator.vibrate) navigator.vibrate(30); // 手机震动

                    // 从底部随机位置发射 2~3 颗烟花
                    const shellCount = 1 + Math.floor(Math.random() * 2);
                    for (let k = 0; k < shellCount; k++) {
                        setTimeout(() => {
                            launchFirework(
                                e.clientX + (Math.random() - 0.5) * 200,
                                e.clientY + (Math.random() - 0.5) * 200
                            );
                        }, k * 150);
                    }

                    createPopEffect(e.clientX, e.clientY);
                    shakeScreen();
                    balloon.style.transform = `scale(${scale * 1.6})`;
                    balloon.style.opacity = '0';
                    setTimeout(() => balloon.remove(), 200);
                    poppedCount++;

                    if (poppedCount === TOTAL_BALLOONS) {
                        setTimeout(() => {
                            createSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 120);
                            createSparkBurst(window.innerWidth / 2 - 150, window.innerHeight / 2, 70);
                            createSparkBurst(window.innerWidth / 2 + 150, window.innerHeight / 2, 70);
                            shakeScreen();
                            stageBalloon.classList.remove('active');
                            setTimeout(() => {
                                stageGift.classList.add('active');
                            }, 500);
                        }, 350);
                    }
                });
                stageBalloon.appendChild(balloon);
            }
        }

        initBalloons();

        // 2. 拆礼物——“哇”特效
        giftBox.addEventListener('click', () => {
            if (giftBox.classList.contains('opened')) return;
            giftBox.classList.add('opened');

            giftOpenWow(window.innerWidth / 2, window.innerHeight / 2);

            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    createSparkBurst(
                        window.innerWidth / 2 + (Math.random() - 0.5) * 350,
                        window.innerHeight / 2 + (Math.random() - 0.5) * 350,
                        40 + Math.random() * 30
                    );
                }, i * 60);

            setTimeout(() => {
                stageGift.classList.remove('active');
                stageCandle.classList.add('active');
            }, 1300);
        });

        // 3. 点击蛋糕吹蜡烛
        const stageCakeClick = document.getElementById('stageCakeClick');
        stageCakeClick.addEventListener('click', () => {
            unlockAudio();
            stageCakeClick.classList.add('stage-flame-hidden');
            releaseBalloons(15);
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    createSparkBurst(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight * 0.7,
                        40 + Math.random() * 30
                    );
                }, i * 80);
            }
            startMusic();
            setTimeout(() => {
                welcomeOverlay.classList.add('hidden');
                const mainFlames = document.querySelectorAll('#birthdayCake .flame');
                mainFlames.forEach(f => f.style.display = 'none');
                setTimeout(() => {
                    celebrate();
                    setInterval(() => { celebrate(); }, 8000);
                }, 8400);
            }, 600);
        });

        // 主卡片上的蛋糕点击逻辑
        let candleLit = false;
        const flames = document.querySelectorAll('#birthdayCake .flame');
        const cake = document.getElementById('birthdayCake');
        flames.forEach(f => f.style.display = 'none');

        cake.addEventListener('click', () => {
            if (candleLit) {
                flames.forEach(f => f.style.display = 'none');
                candleLit = false;
                const rect = cake.getBoundingClientRect();
                createSparkBurst(rect.left + rect.width / 2, rect.top + 20, 50);
                releaseBalloons(15);
            } else {
                flames.forEach(f => f.style.display = '');
                candleLit = true;
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BODY' || e.target.classList.contains('bg-decorations') || e.target.classList.contains('main-container')) {
                createSparkBurst(e.clientX, e.clientY, 12);
            }
        });

        createConfetti();

        // ==================== Happy Birthday 英文生日歌 ====================
               // ==================== Happy Birthday 英文生日歌（双端兼容版） ====================
        const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00;
        const A4 = 440.00, B4 = 493.88, C5 = 523.25, D5 = 587.33;
        const E5 = 659.25, F5 = 698.46, G5 = 783.99;

        const melody = [
            { note: G4, dur: 0.35 }, { note: G4, dur: 0.35 }, { note: A4, dur: 0.7 }, { note: G4, dur: 0.7 }, { note: C5, dur: 0.7 }, { note: B4, dur: 1.3 },
            { note: G4, dur: 0.35 }, { note: G4, dur: 0.35 }, { note: A4, dur: 0.7 }, { note: G4, dur: 0.7 }, { note: D5, dur: 0.7 }, { note: C5, dur: 1.3 },
            { note: G4, dur: 0.35 }, { note: G4, dur: 0.35 }, { note: G5, dur: 0.7 }, { note: E5, dur: 0.7 }, { note: C5, dur: 0.7 }, { note: B4, dur: 0.7 }, { note: A4, dur: 1.3 },
            { note: F5, dur: 0.35 }, { note: F5, dur: 0.35 }, { note: E5, dur: 0.7 }, { note: C5, dur: 0.7 }, { note: D5, dur: 0.7 }, { note: C5, dur: 1.3 },
        ];

        // 自动计算歌曲总时长（约16.4秒）
        const melodyDuration = melody.reduce((acc, curr) => acc + curr.dur, 0);

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        // 解锁音频（破解 iOS 静音、安卓首次无声）
        function unlockAudio() {
            const silentAudio = new Audio();
            silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            silentAudio.play().catch(() => {});
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }
        }

        function playNote(frequency, startTime, duration, ctx, gainNode) {
            const osc = ctx.createOscillator();
            const noteGain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(frequency, startTime);
            noteGain.gain.setValueAtTime(0, startTime);
            noteGain.gain.linearRampToValueAtTime(0.4, startTime + 0.04);
            noteGain.gain.setValueAtTime(0.4, startTime + duration * 0.7);
            noteGain.gain.linearRampToValueAtTime(0, startTime + duration);
            osc.connect(noteGain);
            noteGain.connect(gainNode);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        async function playHappyBirthday() {
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                await ctx.resume();
            }
            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0.5, ctx.currentTime);
            masterGain.connect(ctx.destination);

            let time = ctx.currentTime + 0.1;
            for (const { note, dur } of melody) {
                playNote(note, time, dur, ctx, masterGain);
                time += dur;
            }
        }

        let isPlaying = false;
        let loopTimeout = null;
        async function startMusic() {
            if (isPlaying) return;
            isPlaying = true;
            await playHappyBirthday();
            const totalDuration = melodyDuration * 1000 + 2000; // 自动计算完整时长
            loopTimeout = setTimeout(() => {
                isPlaying = false;
                startMusic();
            }, totalDuration);
        }

        // ==================== 悄悄话弹窗 ====================
        const kittyFace = document.querySelector('.kitty-face');
        const whisperModal = document.getElementById('whisperModal');
        const whisperClose = document.getElementById('whisperClose');

        kittyFace.addEventListener('click', (e) => {
            e.stopPropagation();
            whisperModal.classList.add('show');
        });
        whisperClose.addEventListener('click', () => whisperModal.classList.remove('show'));
        whisperModal.addEventListener('click', (e) => {
            if (e.target === whisperModal) whisperModal.classList.remove('show');
        });

        console.log('🎵 英文生日歌 Happy Birthday to You 已就绪~');
        console.log('🎀 欢迎来到小南瓜的生日派对！');
        console.log('💝 Happy Birthday 小南瓜！愿你天天开心！');
